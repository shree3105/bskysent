version: '3.8'

services:
  ingestion:
    build: 
      context: ./bsky-sentiment
      dockerfile: Dockerfile
    restart: always
    environment:
      # Connects to the shared DB via the host gateway or specific network
      DATABASE_URL: ${DATABASE_URL}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE}
      BLUESKY_PASSWORD: ${BLUESKY_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "ingestion/main.py"]

  processing:
    build: 
      context: ./bsky-sentiment
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: always
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
